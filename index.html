    <div id="moon"  class="fixed hidden  justify-center items-center  w-screen user z-100">
      <!-- <h1>X</h1> -->
        <div id="sL" data-aos="fade-down" data-aos-duration="1000" class="relative uu overflow-hidden h-[55vh] bg-white aspect-square  border-6 rounded-2xl">
          <div class="h-full justify-center items-center signIn bg-gradient-to-br to-orange-200 transition transition-transform m-2">
            <form  action="" class="text-black" id="signIn">
              <p  class="absolute right-0 top-0 border-2 bg-red-500 px-5 w-[10%] xx cursor-pointer">X</p>
              <h1 class=" text-center">SignIn</h1>
              <label for="name" class="name">Name</label>
              <input type="text" id="name" class="rounded h-[50px] w-full sm:text-3xl text-xl border-2 p-2" placeholder="Enter your name here">
              <br><br>
              <label for="email" class="email">Email</label>
              <input type="email" id="email" class="rounded h-[50px] mb-4 w-full sm:text-3xl text-xl border-2 p-2" placeholder="Enter your email here">
              <br>
              <p >Gender</p>
              <input type="radio" value="male" checked id="male" name="gender">
              <label for="">Male</label>
              <input value="female" type="radio"  id="female" name="gender">
              <label for="female">Female</label><br>
              <br>
              <label class="" for="status">Status</label>
              <select name="status" id="status" class="rounded h-[50px] w-full border-2 p-2">
                <option value="active">Active</option>
                <option value="inactive">Inactive</option>
              </select>  
              <div class="text-center mt-2">
                <button type="submit" class="bg-red-500 rounded-2xl min-w-[20%] p-2 text-white">SignUp</button>
                
                <div id="logg" class="toggl absolute cursor-pointer bg-purple-500 w-full  left-0 right-0 m-auto mt-1 p-2 text-white">Login</div>
              </div>
            </form>
          </div>
          <div class="h-full login flex justify-center items-center transition transition-transform bg-gradient-to-br to-orange-200 m-2">
            <form action="" class="text-black" id="login">
            <p class="absolute right-0 top-0 border-2 bg-red-500 px-5 w-[10%] xx ml-auto cursor-pointer">X</p>
            <h1 class=" text-center">Login</h1>
            <label for="nameLog" class="name">Name</label>
            <input type="name" id="nameLog" class="rounded h-[50px] w-full sm:text-3xl text-xl border-2 p-2" placeholder="Enter your name here">
            <br><br>
            <label for="emailLog" class="email">Email</label>
            <input type="email" id="emailLog" class="rounded h-[50px] mb-4 w-full sm:text-3xl text-xl border-2 p-2" placeholder="Enter your email here">
            <div class="text-center mt-2">
              <button type="submit" class="bg-red-500 rounded-2xl min-w-[20%] p-2 text-white">Login</button>
              
              <!-- <div class="toggl cursor-pointer bg-purple-500 max-w-[20%] m-auto rounded-2xl mt-1 p-2 text-white">SignIn</div> -->
              <div id="sss" class="toggl absolute cursor-pointer bg-purple-500 w-full  left-0 right-0 m-auto mt-1 p-2 text-white">SignIn</div>
               </div>

            </form>
          </div>
        </div>
    </div>
    <nav  class="sticky top-0 left-0 w-full log shadow-md z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
          <div class="flex justify-between items-center h-16">
      
            <!-- Logo -->
            <div id="nav"  class="flex items-center space-x-4 cursor-pointer">
              <div class="w-10 h-10 bg-yellow-300 rounded-full border-4 border-black"></div>
              <h1 class="text-2xl font-bold">
                Glutton <span class="text-red-600">Devil</span>

            <!-- Navigation Links -->

              <button id="catalog" class="bg-orange-500 hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-lg transition">Catalog</button>
              <button id="fav" class="bg-pink-400 hover:bg-pink-500 text-white font-semibold px-4 py-2 rounded-lg transition">View Favorites</button>
              <button id="cred" class="bg-red-500 hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-lg transition">
                <i class="fa-solid fa-circle-user"></i>
              </button>
            </div>
            
            <!-- Mobile Menu Button (Optional for extra spice) -->
            <div id="navbtn" class="md:hidden">
              <button class="text-black focus:outline-none">
                <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M4 6h16M4 12h16M4 18h16" />
                </svg>
              </button>
            </div>
            
          </div>
        </div>

      <div class="mbnav m-auto text-end">
        <button id="cse" class="bg-pink-400 block  ml-auto  w-[80%] m-auto">X</button>
        <button id="home1" class="bg-red-500 mt-[40vh] home block hover:bg-red-600 text-white font-semibold px-4 py-2 rounded-lg transition w-[80%] m-auto">Home</button>
        <button id="catalog1" class="bg-orange-500 my-3 catalog block hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-lg transition w-[80%] m-auto">Catalog</button>
        
         <button id="fav1" class="bg-pink-400 block hover:bg-pink-500 text-white font-semibold px-4 py-2 rounded-lg transition w-[80%] m-auto">View Favorites</button>
         <button id="cred1" class="bg-orange-300 my-3 block hover:bg-yellow-500 text-white font-semibold px-4 py-2 rounded-lg transition w-[80%] m-auto"><i class="fa-solid fa-circle-user"></i></button>
        
      </div>
      <div  data-aos="fade-down" data-aos-duration="1000" id="hero" class="hero w-[80%] m-auto border-5 min-h-[100vh]">
        <section data-aos="fade-down" data-aos-duration="1000" class="bg-gradient-to-br from-red-100 to-orange-200 text-center py-20 px-6">
          <h1 class="text-5xl md:text-6xl font-extrabold mb-4">Welcome to <span class="text-red-600">Glutton Devil</span></h1>
          <p class="text-xl md:text-2xl text-gray-700 mb-8">Satisfy your cravings. Discover your inner foodie.</p>
          <div  class="bg-red-500 m-auto w-[50%] hover:bg-red-600 text-white px-6 py-3 rounded-full font-semibold transition duration-300 shadow-lg">
            <button id="catalog2" class="bg-red-500 my-3 catalog  hover:bg-orange-600 text-white font-semibold px-4 py-2 rounded-lg transition  m-auto">View Catalog</button>
          </div>
        </section>
        
        <!-- 🎠 CAROUSEL SECTION -->
        <section data-aos="fade-in" data-aos-duration="1000" data-aos-delay="500"  id="carousel-section" class="hidden bg-white py-12 px-4">
          <div class="text-3xl font-bold text-center mb-6"><span class="text-red-600">Your</span> Popular Picks</div>
          <div class="relative max-w-4xl mx-auto overflow-hidden rounded-xl shadow-lg">
            <div id="carousel-images" class="flex transition-transform duration-700 ease-in-out">
              <!-- JS will inject slides here -->
              
              </div>
              <button id="prev" class="absolute left-2 top-1/2 -translate-y-1/2 bg-white bg-opacity-80 hover:bg-opacity-100 p-2 rounded-full shadow-md"><i class="fa-solid fa-circle-left"></i></button>
              <button id="next" class="absolute right-2 top-1/2 -translate-y-1/2 bg-white bg-opacity-80 hover:bg-opacity-100 p-2 rounded-full shadow-md"><i class="fa-solid fa-circle-right"></i></button>
            </div>
          </section>
          
      </div>
      <!-- Add margin top to push content below navbar -->

    <div id="canvas1" class="min-h-[100vh] py-10 hidden  md:w-[60%] w-[80%] m-auto border-6 bg-yellow-300">

                <button type="submit" class="bg-pink-500 text-white ml-auto md:h-[45px] block md:inline border-2 my-5 font-bold py-2 px-4 rounded">Submit</button>
            </form>

        </div>
        <div  class="m-auto w-[80%]">

            <div id="dishes" class="md:grid gr gap-2 lg:grid-cols-3 md:grid-cols-2">
                
            </div>

    </div>
    </div>
    <div id="canvas2" class="hidden py-10 min-h-[100vh] md:w-[60%] w-[80%] m-auto border-6 bg-yellow-300">

            <select name="FoodCategory" class="w-full bg-white" id="cat">
                
            </select>
            <button id="catbtn" class="bg-pink-500 text-white ml-auto md:h-[45px] block md:inline border-2 my-5 font-bold py-2 px-4 rounded">Submit</button>

        </form>
        <div  class="m-auto w-[80%]">
            <div id="spinnerSelect" class="animate-spin aspect-square border-5 hidden rounded-full border-x-blue-500 border-y-cyan-500"></div>
            <div id="dishesCategory" class="md:grid gr gap-2 lg:grid-cols-3 md:grid-cols-2">
                
            </div>

    </div>
    </div>
    <div id="canvas3" class="py-10 min-h-[100vh] hidden md:w-[60%] w-[80%] m-auto border-6 bg-yellow-300">
        
        <div  class="m-auto w-[80%]">
            <h1 class="text-3xl font-bold">Your Favorite Dishes:</h1>
            <div id="err" class="hidden">

            </div>
            <div id="favSpinner" class="animate-spin aspect-square border-5 hidden rounded-full border-x-blue-500 border-y-cyan-500"></div>
            <div id="favDisplay" class="md:grid gr gap-2 lg:grid-cols-3 md:grid-cols-2">
                
            </div>

    </div>

    <div  class="details py-5" id="details">
