<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Food Guide Chat</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://kit.fontawesome.com/213bcdc022.js" crossorigin="anonymous"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bree+Serif&display=swap');

    * {
      font-family: 'Bree Serif', serif;
    }
    #cat{
      background: linear-gradient(to bottom right, red, rgba(255, 255, 255, 0.5));
      backdrop-filter: blur(10px);
    }
  </style>
</head>
<body class="bg-orange-300 overflow-hidden">
  <a href="/index.html" class="text-4xl text-center z-10 bg-blue-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded-full fixed top-5 right-5">
    <i class="fa-solid fa-home"></i>
  </a>

  <div class="flex justify-center items-center h-screen">
    <div class="flex flex-col w-[90%] md:w-[60%] border-2 rounded-xl overflow-hidden">
      
      <!-- Header -->
      <h1 class="bg-red-500 px-4 py-3 text-3xl text-white font-bold">
        Food Guide
      </h1>

      <!-- Chat area (scrollable) -->
      <div id="cat" class="flex  flex-col gap-2 p-4 overflow-y-auto h-[70vh] scroll-smooth">
        <!-- Messages will be appended here -->
      </div>

      <!-- Form input (sticky at bottom) -->
      <form id="form" class="relative flex items-center gap-2 p-4 bg-gradient-to-bl from-red-300 to-orange-500 border-t">
        <input
          class="flex-1 p-4 pr-16 rounded-full border-2 focus:outline-none"
          placeholder="Type something tasty..."
        />
        <button type="submit" class="absolute right-6">
          <i class="fa-solid fa-paper-plane text-xl text-pink-500"></i>
        </button>
      </form>
    </div>
  </div>

  <script src="chat.js"></script>
</body>
</html>
